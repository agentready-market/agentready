# Publishes server.json to the official MCP registry from CI (no local terminal).
# Auth is GitHub OIDC: the workflow identity proves the repo belongs to
# agentready-market, granting the io.github.agentready-market/* namespace.
name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths: ["server.json"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: curl -fL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Login to registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server
        run: ./mcp-publisher publish
