# .github/workflows/publish-npm.yml (public repo) — publishes the npm package
# from CI, zero local terminal (same pattern as publish-mcp.yml).
# Prereq (owner, browser-only): npmjs.com account → Access Tokens → "Automation"
# token → paste as repo secret NPM_TOKEN (Settings → Secrets → Actions).
# Runs when npm/package.json changes on main, or manually from the Actions tab.
name: Publish to npm

on:
  push:
    branches: [main]
    paths: ["npm/package.json"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance (--provenance links the package to this repo/run)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install and build
        working-directory: npm
        run: npm install --no-audit --no-fund

      - name: Publish (with provenance)
        working-directory: npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
