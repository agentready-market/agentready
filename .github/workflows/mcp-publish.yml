name: mcp-publish
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Write server.json
        run: |
          cat > server.json << 'EOF'
          {
            "$schema": "https://static.modelcontextprotocol.io/schemas/2025-09-16/server.schema.json",
            "name": "io.github.agentready-market/audit",
            "description": "AgentReady.market audit: can an AI shopping agent find, understand and BUY on this store? /100.",
            "version": "1.0.1",
            "repository": {
              "url": "https://github.com/agentready-market/agentready",
              "source": "github"
            },
            "websiteUrl": "https://www.agentready.market",
            "remotes": [
              {
                "type": "streamable-http",
                "url": "https://www.agentready.market/mcp"
              }
            ]
          }
          EOF
      - name: Install publisher
        run: curl -sSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
